<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4ec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<title>A Little Message for You</title>
<style>
:root{--bg1:#fff4ec;--bg2:#fde8f0;--card:#fffdfb;--ink:#3b2a2a;--soft:#6b4f4f;--rose:#c2185b;--rose2:#f8c8d8;--accent:#9c3d6b;}
*{box-sizing:border-box}
html{font-size:24px;-webkit-text-size-adjust:100%}
@media (min-width:700px){html{font-size:27px}}
body{margin:0;min-height:100vh;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;color:var(--ink);line-height:1.5;
 background:linear-gradient(170deg,var(--bg1),var(--bg2) 60%,#eaf4ff);}
main{max-width:760px;margin:0 auto;padding:1.1rem 1rem 2rem}
.date{font-size:1.25rem;font-weight:700;color:var(--accent);text-align:center;margin:.2rem 0 0;letter-spacing:.01em}
h1.greet{font-size:2rem;line-height:1.2;text-align:center;margin:.3rem 0 1rem;color:var(--ink)}
.card{background:var(--card);border-radius:36px;padding:1.1rem 1.2rem 1.4rem;box-shadow:0 10px 30px rgba(180,110,130,.18);border:3px solid #f7d6e0}
.art{display:block;width:min(62vw,300px);height:auto;margin:0 auto .4rem}
.tag{display:block;width:max-content;margin:0 auto .5rem;font-size:.8rem;font-weight:700;padding:.25rem .9rem;border-radius:999px;background:#fbe3ec;color:#7a2a4f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.tag.wisdom{background:#fbe3ec;color:#7a2a4f}.tag.pranic{background:#fff0c7;color:#6b4a00}
h2.title{font-size:1.6rem;line-height:1.25;text-align:center;margin:.2rem 0 .6rem;color:var(--rose)}
p.msg{font-size:1.1rem;margin:0 0 .5rem;text-align:center}
p.by{font-size:.95rem;text-align:center;color:var(--soft);font-style:italic;margin:0 0 .6rem}
.step{background:#fff3d6;border:3px dashed #f2c46b;border-radius:26px;padding:.8rem 1rem;margin-top:.9rem}
.step b{display:block;font-size:.95rem;color:#8a5a00;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.step span{font-size:1.1rem}
button.read{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:80px;margin:1.2rem 0 0;font:700 1.1rem system-ui,-apple-system,"Segoe UI",sans-serif;
 color:#fff;background:#b0306a;border:none;border-radius:999px;box-shadow:0 6px 0 #7d1f4a;cursor:pointer;touch-action:manipulation}
button.read:active{transform:translateY(4px);box-shadow:0 2px 0 #7d1f4a}
button.read:focus-visible{outline:5px solid #ffcc4d;outline-offset:4px}
.note{margin:1.1rem 0 0;text-align:center;font-size:1.05rem;color:#6b3552;background:#fde2ec;border-radius:22px;padding:.7rem 1rem}
.note[hidden]{display:none}
/*PHOTO-CSS-START*/
/* family photo */
.photo{margin:1.4rem auto 0;max-width:640px;background:#fff;padding:.7rem .7rem 1rem;border-radius:28px;box-shadow:0 12px 30px rgba(120,70,90,.22);transform:rotate(-1.2deg);border:1px solid #f3e3e8}
.photo[hidden]{display:none}
.photo button{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;border-radius:20px;overflow:hidden}
.photo button:focus-visible{outline:5px solid #ffcc4d;outline-offset:4px}
.photo img{display:block;width:100%;height:auto;max-height:70vh;object-fit:cover;border-radius:20px;background:#f7eef1}
.photo figcaption{text-align:center;font-size:1.1rem;color:#7a2a4f;margin-top:.6rem;font-style:italic}
.photo .hint{display:block;font-size:.8rem;color:var(--soft);font-style:normal;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.viewer{position:fixed;inset:0;z-index:10;background:rgba(40,20,30,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;gap:1rem}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:78vh;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}
.viewer button{min-height:72px;min-width:220px;font:700 1.1rem system-ui,-apple-system,"Segoe UI",sans-serif;color:#7a2a4f;background:#fff;border:0;border-radius:999px;cursor:pointer}
/*PHOTO-CSS-END*/
footer{text-align:center;color:var(--soft);font-size:.85rem;margin-top:1.2rem}
/* gentle animations */
.art .floaty{animation:float 5s ease-in-out infinite;transform-origin:100px 100px}
.spark{animation:sparkle 3s ease-in-out infinite}
.spin{animation:spin 40s linear infinite;transform-origin:100px 100px}
.steam{animation:steam 3.5s ease-in-out infinite}
.beat{animation:beat 3s ease-in-out infinite;transform-origin:100px 105px}
.sway{animation:sway 5s ease-in-out infinite;transform-origin:100px 170px}
.flap{animation:flap 2.8s ease-in-out infinite;transform-origin:100px 100px}
.twinkle{animation:sparkle 3s ease-in-out infinite}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.45}}
.flame{animation:flicker 2s ease-in-out infinite;transform-origin:100px 72px}
.bub{animation:bub 3s ease-in infinite}.b2{animation-delay:1.3s}
.float2{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sparkle{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes steam{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:.9;transform:translateY(-5px)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.9)}}
@keyframes flicker{0%,100%{transform:scale(1)}50%{transform:scale(1.06,.95)}}
@keyframes bub{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-contrast:more){:root{--ink:#000;--soft:#222}}
</style>
</head>
<body>
<main>
  <p class="date" id="date"></p>
  <h1 class="greet" id="greet"></h1>
  <article class="card" aria-live="polite">
    <svg class="art" id="art" viewBox="0 0 200 200" role="img" aria-hidden="true"></svg>
    <span class="tag" id="tag"></span>
    <h2 class="title" id="title"></h2>
    <p class="msg" id="msg"></p>
    <p class="by" id="by" hidden></p>
    <div class="step"><b>🌱 Today's little step</b><span id="step"></span></div>
    <button class="read" id="read" type="button"><span aria-hidden="true">🔊</span> <span id="readLabel">Read aloud</span></button>
    <p class="note" id="note" hidden>Come back tomorrow for a new message 🌸</p>
  </article>
  <!--PHOTO-START-->
  <figure class="photo" id="photo" hidden>
    <button type="button" id="photoBtn" aria-label="Show the photo bigger"><img id="photoImg" alt="A family photo" decoding="async"></button>
    <figcaption id="photoCap">A happy memory 💛<span class="hint">Tap the photo to see it bigger</span></figcaption>
  </figure>
  <div class="viewer" id="viewer" hidden role="dialog" aria-label="Family photo, large">
    <img id="viewerImg" alt="A family photo, large">
    <button type="button" id="viewerClose">✕ Close</button>
  </div>
  <!--PHOTO-END-->
  <footer id="foot"></footer>
</main>

  if (PRANIC[i]) ENTRIES.push(mk(PRANIC[i], 'pranic'));
}

function localKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayNumber(d){ return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
// Day 1 (Sept 29, 2026) starts with the first lesson, so the teachings build gently in order.
const START_DAY = Math.floor(Date.UTC(2026, 8, 29) / 86400000);
function entryFor(d){ const n = ENTRIES.length; return ENTRIES[(((dayNumber(d) - START_DAY) % n) + n) % n]; }
function greeting(h){ return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }

function render(){
  const now = new Date();
  const e = entryFor(now);
  document.getElementById('date').textContent = now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('greet').textContent = greeting(now.getHours()) + ', ' + NAME + ' 💛';
  document.title = 'A Little Message for ' + NAME;
  document.getElementById('art').innerHTML = SPARK + '<g class="floaty">' + (ART[e.art] || ART.heart) + '</g>';
  const tag = document.getElementById('tag'); tag.textContent = KIND[e.kind]; tag.className = 'tag ' + e.kind;
  document.getElementById('title').textContent = e.title;
  document.getElementById('msg').textContent = e.text;
  const by = document.getElementById('by'); by.hidden = !e.by; by.textContent = e.by ? '— ' + e.by : '';
  document.getElementById('step').textContent = ' ' + e.step;
  document.getElementById('foot').textContent = 'A new message arrives every morning, ' + NAME + '.';
  // once-a-day memory
  const key = 'daily-msg-seen', today = localKey(now);
  let seen = null; try { seen = localStorage.getItem(key); } catch(_) {}
  document.getElementById('note').hidden = (seen !== today);
  try { localStorage.setItem(key, today); } catch(_) {}
  renderPhoto(now); //PHOTO-CALL
  renderedDay = today;
  return e;
}


//PHOTO-JS-START
// One family photo per day, cycling through all of them before repeating.
function dayIndex(d){ return dayNumber(d) - START_DAY; }
function renderPhoto(now){
  const fig = document.getElementById('photo');
  if (typeof PHOTOS === 'undefined' || !PHOTOS.length) { fig.hidden = true; return; }
  const n = PHOTOS.length, ph = PHOTOS[((dayIndex(now) % n) + n) % n];
  const img = document.getElementById('photoImg');
  img.onload = () => { fig.hidden = false; };
  img.onerror = () => { fig.hidden = true; };   // e.g. standalone copy without the photos folder
  if (ph.w && ph.h) { img.width = ph.w; img.height = ph.h; }
  img.src = ph.src;
  const yr = (ph.date || '').slice(0,4);
  document.getElementById('photoCap').firstChild.textContent = yr ? 'A happy memory from ' + yr + ' 💛' : 'A happy memory 💛';
}
const viewer = document.getElementById('viewer');
document.getElementById('photoBtn').addEventListener('click', () => {
  document.getElementById('viewerImg').src = document.getElementById('photoImg').src;
  viewer.hidden = false; document.getElementById('viewerClose').focus();
});
function closeViewer(){ viewer.hidden = true; document.getElementById('photoBtn').focus(); }
document.getElementById('viewerClose').addEventListener('click', closeViewer);
viewer.addEventListener('click', e => { if (e.target === viewer || e.target.id === 'viewerImg') closeViewer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !viewer.hidden) closeViewer(); });
//PHOTO-JS-END

let renderedDay = null;
let current = render();

// Read aloud (slow, gentle)
const btn = document.getElementById('read'), label = document.getElementById('readLabel');
if (!('speechSynthesis' in window)) { btn.hidden = true; }
btn.addEventListener('click', () => {
  const s = window.speechSynthesis;
  if (s.speaking) { s.cancel(); label.textContent = 'Read aloud'; return; }
  const e = current;
  const text = document.getElementById('greet').textContent.replace('💛','') + '. ' + e.title + '. ' + e.text + (e.by ? ' — ' + e.by + '.' : '') + ' Today\'s little step: ' + e.step;
  const u = new SpeechSynthesisUtterance(text.replace(/[“”]/g,''));
  u.rate = 0.75; u.pitch = 1; u.lang = 'en-US';
  const v = s.getVoices().find(v => /en(-|_)/i.test(v.lang) && /female|samantha|karen|moira|serena|victoria|google us english/i.test(v.name));
  if (v) u.voice = v;
  u.onend = u.onerror = () => { label.textContent = 'Read aloud'; };
  label.textContent = 'Stop reading';
  s.speak(u);
});

// If the page is left open past midnight, gently refresh to the new day's message.
setInterval(() => { if (localKey(new Date()) !== renderedDay) current = render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && localKey(new Date()) !== renderedDay) current = render(); });
</script>
